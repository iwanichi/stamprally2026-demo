<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>いちのせき産業まつり イベント間スタンプラリー</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* 全体の土台となる背景色 (#ffc107) */
    body { 
      font-family: sans-serif; 
      text-align: center; 
      background-color: #ffc107;
      color: #2b1704;
      margin: 0; 
      padding: 20px 20px 40px 20px; 
      min-height: 100vh; 
      box-sizing: border-box; 
      display: flex; 
      flex-direction: column; 
      overflow-x: hidden; 
      position: relative;
    }

    /* 背景画像（jack.jpg）を円形切り抜き＆薄目で四隅に散らす */
    .bg-jack {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
      border-radius: 50%;
      object-fit: cover;
      mix-blend-mode: multiply;
    }

    .bg-jack.top-left { top: -15px; left: -15px; width: 90px; height: 90px; transform: rotate(-15deg); }
    .bg-jack.top-right { top: 30px; right: -10px; width: 75px; height: 75px; transform: rotate(20deg); }
    .bg-jack.mid-left { top: 45%; left: -20px; width: 80px; height: 80px; transform: rotate(10deg); }
    .bg-jack.mid-right { top: 55%; right: -15px; width: 85px; height: 85px; transform: rotate(-25deg); }
    .bg-jack.bottom-left { bottom: 20px; left: 10px; width: 70px; height: 70px; transform: rotate(-10deg); opacity: 0.12; }
    .bg-jack.bottom-right { bottom: -10px; right: 15px; width: 90px; height: 90px; transform: rotate(15deg); opacity: 0.12; }

    .content { flex: 1; position: relative; z-index: 1; } 
    
    /* テストモード用バッジ */
    .test-badge { 
      display: inline-block;
      background: #c0392b; 
      color: #ffffff; 
      font-size: 12px; 
      font-weight: bold; 
      padding: 4px 10px; 
      border-radius: 4px; 
      margin-bottom: 10px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
    }

    h1 { color: #2b1704; margin-bottom: 5px; margin-top: 5px; font-size: 20px; line-height: 1.3; }
    p { color: #4a2c11; margin-top: 5px; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
